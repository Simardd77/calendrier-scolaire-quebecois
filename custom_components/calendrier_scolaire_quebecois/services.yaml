add_source:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: calendrier_scolaire_quebecois
    name:
      required: true
      example: Calendrier 2024-2025
      selector:
        text:
    source_url:
      required: true
      example: https://exemple.qc.ca/calendrier-scolaire.pdf
      selector:
        text:
          type: url
    source_type:
      required: false
      default: direct_url
      selector:
        select:
          translation_key: source_type
          options:
            - direct_url
            - school_website
            - ical

remove_source:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: calendrier_scolaire_quebecois
    source_id:
      required: true
      example: 6b1f2c8a9d04
      selector:
        text:

refresh_calendar:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: calendrier_scolaire_quebecois

parse_pdf:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: calendrier_scolaire_quebecois
    file_path:
      required: true
      example: /config/calendriers/calendrier-2024-2025.pdf
      selector:
        text:

add_manual_event:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: calendrier_scolaire_quebecois
    summary:
      required: true
      example: Éducation physique
      selector:
        text:
    start_date:
      required: true
      example: "2026-09-01"
      selector:
        date:
    end_date:
      required: true
      example: "2027-06-23"
      selector:
        date:
    weekdays:
      required: false
      selector:
        select:
          multiple: true
          translation_key: weekdays
          options:
            - label: Lundi
              value: "0"
            - label: Mardi
              value: "1"
            - label: Mercredi
              value: "2"
            - label: Jeudi
              value: "3"
            - label: Vendredi
              value: "4"
            - label: Samedi
              value: "5"
            - label: Dimanche
              value: "6"
    start_time:
      required: false
      example: "10:00:00"
      selector:
        time:
    end_time:
      required: false
      example: "11:00:00"
      selector:
        time:
    skip_closures:
      required: false
      default: true
      selector:
        boolean:

remove_manual_event:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: calendrier_scolaire_quebecois
    event_id:
      required: true
      example: a1b2c3d4e5f6
      selector:
        text:
