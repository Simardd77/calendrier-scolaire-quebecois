name: CI
# Validation et publication vivent dans le meme fichier a dessein: "needs" ne
# traverse pas les fichiers de workflow. Tant qu'ils etaient separes, une
# release pouvait etre publiee alors que les tests venaient d'echouer.
#
# Une seule branche longue, main. Les branches de travail en partent et y
# reviennent par pull request.
#
#   push sur main (fusion)   -> validation, puis prerelease "<manifest>-beta.N"
#   PR vers main, depuis feat/** ou fix/**
#                            -> validation, puis prerelease "<manifest>-beta.N"
#   autre PR vers main       -> validation seule
#   lancement manuel (main)  -> validation, puis release stable "<manifest>"
#
# La beta sort a l'ouverture de la PR, puis a chaque push dans sa branche (les
# evenements par defaut d'une PR: opened, synchronize, reopened). Elle est
# construite a partir du dernier commit de la branche de la PR, pas du resultat
# de la fusion. Les PR venant d'un fork ne publient rien: leur jeton n'a pas le
# droit d'ecrire.
#
# La fusion dans main publie aussi une beta, quelle que soit la branche de la
# PR. C'est la seule beta qui correspond exactement au contenu de main, PR
# combinees comprises: c'est celle a tester avant de lancer la stable. Une
# fonctionnalite passe donc par deux betas, une a la PR et une a la fusion.
#
# Le numero N est partage par toutes les betas: la plus recente est celle
# proposee aux testeurs. La branche source est indiquee dans les notes de la
# release.
#
# Lancer la stable: onglet Actions > CI > Run workflow, branche main. Elle
# publie la version inscrite dans manifest.json, sur le dernier commit de main.
#
# --- Quand incrementer "version" dans manifest.json -------------------------
#
# JUSTE APRES la sortie d'une stable, dans une PR vers main, et non avant la
# stable. La raison est l'ordre des versions tel que le calcule AwesomeVersion,
# la bibliotheque utilisee par Home Assistant et HACS:
#
#   1.0.0-beta.1  <  1.0.0     une prerelease se classe SOUS sa version
#   1.0.1-beta.1  >  1.0.0
#
# Laisser le manifeste a 1.0.0 apres la sortie de v1.0.0 produirait donc des
# beta classees plus anciennes que la stable deja installee: aucun testeur ne se
# les verrait proposer. En incrementant des la sortie, les beta annoncent la
# version vers laquelle elles vont et se classent au-dessus de la stable.
#
# Le cycle, en un coup d'oeil:
#
#   v1.0.0 sort  ->  PR qui passe le manifeste a 1.0.1 (ou 1.1.0)
#   chaque fusion dans main publie ensuite 1.0.1-beta.N
#   ->  lancement manuel: v1.0.1 sort avec le numero deja inscrit.
#
# Si le manifeste n'a pas ete incremente apres une stable, la publication
# d'une beta echoue en le disant: le tag stable existe deja pour cette version.
#
# Changer d'avis en route est sans risque: passer de 1.0.1 a 1.1.0 fait
# simplement repartir la numerotation des beta a beta.1.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
# Une execution a la fois par branche. Deux fusions rapprochees lanceraient deux
# publications concurrentes, qui liraient les memes tags et calculeraient le meme
# numero de beta. L'annulation en vol est desactivee: interrompre une publication
# a mi-chemin laisserait un tag sans release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 custom_components/ tests/ tools/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check code formatting
        run: |
          black --check custom_components/ tests/ tools/

      - name: Run tests
        run: |
          pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # La publication attend les trois controles. C'est tout l'objet de la
    # consolidation dans ce fichier.
    needs: [validate, hacs, hassfest]
    # Seuls publient: le lancement manuel (stable), un push sur main (beta) et
    # une PR du depot lui-meme dont la branche commence par feat/ ou fix/
    # (beta).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'feat/') || startsWith(github.head_ref, 'fix/')))
    permissions:
      contents: write
    # Un groupe commun a toutes les branches: deux pushes simultanes sur des
    # branches differentes liraient les memes tags et calculeraient le meme
    # numero de beta. Si plusieurs executions attendent, GitHub ne garde que
    # la plus recente: une beta intermediaire peut donc etre sautee.
    concurrency:
      group: ci-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Sur une PR, le checkout par defaut est un commit de fusion
          # temporaire: on prend le dernier commit de la branche, qui est
          # aussi celui sur lequel le tag sera pose.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Determine version
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          MANIFEST="custom_components/calendrier_scolaire_quebecois/manifest.json"

          BASE=$(python3 -c \
            "import json; print(json.load(open('${MANIFEST}'))['version'])")

          if ! printf '%s' "${BASE}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::La version du manifeste doit etre X.Y.Z, lue: ${BASE}"
            exit 1
          fi

          if [[ "${EVENT}" == workflow_dispatch ]]; then
            if [[ "${GITHUB_REF}" != refs/heads/main ]]; then
              echo "::error::La stable se lance depuis main, pas depuis ${GITHUB_REF}."
              exit 1
            fi
            VERSION="${BASE}"
            TAG="v${VERSION}"

            # Un tag deja present signifie que le manifeste n'a pas ete
            # incremente: publier une seconde fois la meme version ecraserait
            # silencieusement la precedente.
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "::error::Le tag ${TAG} existe deja. Incrementez \"version\"" \
                   "dans ${MANIFEST} avant de lancer la stable."
              exit 1
            fi

            PRERELEASE=false
            PREV=$(git tag --list 'v*' --sort=-version:refname \
                   | grep -v -- '-' | head -1 || true)
          else
            # Numero de beta deduit des tags existants pour cette version de
            # base, trie numeriquement: beta.10 doit suivre beta.9.
            LAST=$(git tag --list "v${BASE}-beta.*" \
                   | sed 's/.*beta\.//' | sort -n | tail -1 || true)
            # Une beta sous une stable deja publiee serait classee plus
            # ancienne qu'elle: le manifeste doit avoir ete incremente.
            if git rev-parse -q --verify "refs/tags/v${BASE}" >/dev/null; then
              echo "::error::La stable v${BASE} existe deja. Incrementez" \
                   "\"version\" dans ${MANIFEST} pour publier des beta."
              exit 1
            fi
            VERSION="${BASE}-beta.$(( ${LAST:-0} + 1 ))"
            TAG="v${VERSION}"
            PRERELEASE=true
            PREV=$(git tag --list 'v*' --sort=-version:refname | head -1 || true)
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=${TAG}" >> "$GITHUB_OUTPUT"
          echo "PRERELEASE=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "PREV_TAG=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Version a publier: ${VERSION} (prerelease=${PRERELEASE})"

      - name: Sync manifest version in the build
        # Pour la stable c'est un no-op, la version lue etant deja la bonne.
        # Pour une beta, cela fait porter au zip le numero de beta, pour que Home
        # Assistant rapporte la version reellement installee.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib

          path = pathlib.Path(
              "custom_components/calendrier_scolaire_quebecois/manifest.json"
          )
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = os.environ["VERSION"]
          path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Build release archives
        run: |
          set -euo pipefail
          mkdir -p dist

          # Archive destinee a HACS. Son nom est fixe, car il vient de la cle
          # "filename" de hacs.json et ne peut pas porter la version. Son
          # contenu est celui du dossier du composant, a la racine de l'archive:
          # HACS fait un extractall direct dans
          # config/custom_components/<domaine>/, sans retirer de prefixe.
          ( cd custom_components/calendrier_scolaire_quebecois \
            && zip -r "${GITHUB_WORKSPACE}/dist/calendrier_scolaire_quebecois.zip" . \
                 -x '*__pycache__*' -x '*.pyc' )

          # Archive destinee a l'installation manuelle, avec l'arborescence
          # complete a recopier dans la configuration.
          zip -r "dist/calendrier-scolaire-quebecois-${VERSION}.zip" \
            custom_components/ \
            hacs.json \
            README.md \
            LICENSE \
            -x '*__pycache__*' -x '*.pyc'

          echo "Contenu de l'archive HACS :"
          unzip -l dist/calendrier_scolaire_quebecois.zip | head -20
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          if [[ -z "${PREV_TAG}" ]]; then
            COMMITS=$(git log --pretty=format:"%s" | head -30)
          else
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s")
          fi

          FEATS="" FIXES="" CI="" DOCS="" CHORES="" OTHER=""
          while IFS= read -r line; do
            [[ -z "${line}" ]] && continue
            # Bruit exclu du changelog public: les commits de fusion generes par
            # GitHub ("Merge pull request #N ...") et le bump de version, qui est
            # une plomberie de release sans interet pour l'utilisateur.
            case "${line}" in
              "Merge pull request "*|"Merge branch "*) continue ;;
              chore:*bump*|chore:*version*) continue ;;
            esac
            case "${line}" in
              feat*) FEATS="${FEATS}- ${line}\n" ;;
              fix*)  FIXES="${FIXES}- ${line}\n" ;;
              ci*)   CI="${CI}- ${line}\n" ;;
              docs*) DOCS="${DOCS}- ${line}\n" ;;
              chore*|refactor*|style*|perf*|test*) CHORES="${CHORES}- ${line}\n" ;;
              *)     OTHER="${OTHER}- ${line}\n" ;;
            esac
          done <<< "${COMMITS}"

          LOG=""
          [[ -n "${FEATS}" ]]  && LOG="${LOG}## 🚀 Nouveautés\n${FEATS}\n"
          [[ -n "${FIXES}" ]]  && LOG="${LOG}## 🐛 Corrections\n${FIXES}\n"
          [[ -n "${DOCS}" ]]   && LOG="${LOG}## 📝 Documentation\n${DOCS}\n"
          [[ -n "${CI}" ]]     && LOG="${LOG}## 📦 Intégration continue\n${CI}\n"
          [[ -n "${CHORES}" ]] && LOG="${LOG}## 🧹 Maintenance\n${CHORES}\n"
          [[ -n "${OTHER}" ]]  && LOG="${LOG}## 📌 Autres\n${OTHER}\n"

          {
            echo "CHANGELOG<<CHANGELOG_EOF"
            echo -e "${LOG}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

          # Lien de comparaison: la plage reelle, et non une URL tronquee.
          if [[ -z "${PREV_TAG}" ]]; then
            echo "COMPARE_URL=${SERVER}/${REPO}/commits/${TAG_NAME}" \
              >> "$GITHUB_OUTPUT"
          else
            echo "COMPARE_URL=${SERVER}/${REPO}/compare/${PREV_TAG}...${TAG_NAME}" \
              >> "$GITHUB_OUTPUT"
          fi
        env:
          PREV_TAG: ${{ steps.version.outputs.PREV_TAG }}
          TAG_NAME: ${{ steps.version.outputs.TAG_NAME }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          name: "Calendrier Scolaire Québécois ${{ steps.version.outputs.TAG_NAME }}"
          body: |
            Branche source: `${{ github.head_ref || github.ref_name }}`

            ## Changements
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation

            Via HACS, rien à télécharger : HACS récupère
            `calendrier_scolaire_quebecois.zip` automatiquement.

            Pour une installation manuelle, prenez
            `calendrier-scolaire-quebecois-${{ steps.version.outputs.VERSION }}.zip`
            et recopiez son dossier `custom_components/` dans votre
            configuration Home Assistant.

            **Full Changelog**: ${{ steps.changelog.outputs.COMPARE_URL }}
          files: |
            dist/calendrier_scolaire_quebecois.zip
            dist/calendrier-scolaire-quebecois-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: ${{ steps.version.outputs.PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
